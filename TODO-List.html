<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO List</title>

    <style>

        body{
            font-family: Arial;
            background-color: ivory;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container{
            width: 400px;
            background-color: pink;

            padding: 20px;
            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
        }

        input{
            width: 250px;
            padding: 10px;

            margin-left: 10px;
        }

        /* 완료 수정 삭제 버튼 */
        button{
            padding: 2px 5px;
            cursor: pointer;
            font-size: 10px;
        }

        /* 추가 버튼 */
        .addBtn{
            padding: 10px;
            font-size: 14px;
        }

        li{
            margin-top: 10px;
        }

        .completed{
            text-decoration: line-through;
            color: orangered;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>TO DO LIST</h1>

        <input type="text"
        id="todoInput"
        placeholder="할 일을 입력하세요">

        <button class="addBtn" onclick="addTodo()">
            추가
        </button>

        <ul id="todoList"></ul>

    </div>

    <script>

        // 저장된 데이터 가져오기
        let todos =
        JSON.parse(localStorage.getItem("todos"))
        || [];

        // 처음 화면 출력
        renderTodos();


        // Enter 키 입력
        document.querySelector("#todoInput")
        .addEventListener("keydown", function(event){

            if(event.key === "Enter"){
                addTodo();
            }

        });


        // 할 일 추가
        function addTodo(){

            let input =
            document.querySelector("#todoInput");

            let text = input.value;

            if(text === ""){
                alert("할 일을 입력하세요");
                return;
            }

            todos.push({
                text : text,
                completed : false
            });

            saveTodos();

            renderTodos();

            input.value = "";
        }


        // 화면 출력
        function renderTodos(){

            let list =
            document.querySelector("#todoList");

            list.innerHTML = "";

            for(let i=0; i<todos.length; i++){

                list.innerHTML += `

                <li class="${todos[i].completed ? 'completed' : ''}">

                    ${todos[i].text}

                    <button onclick="completeTodo(${i})">
                        완료
                    </button>

                    <button onclick="editTodo(${i})">
                        수정
                    </button>

                    <button onclick="deleteTodo(${i})">
                        삭제
                    </button>

                </li>

                `;
            }

        }


        // 완료 기능
        function completeTodo(index){

            todos[index].completed =
            !todos[index].completed;

            saveTodos();

            renderTodos();
        }


        // 수정 기능
        function editTodo(index){

            let newText = prompt(
                "수정할 내용을 입력하세요",
                todos[index].text
            );

            if(newText !== null){

                todos[index].text = newText;

                saveTodos();

                renderTodos();
            }

        }


        // 삭제 기능
        function deleteTodo(index){

            todos.splice(index, 1);

            saveTodos();

            renderTodos();
        }


        // localStorage 저장
        function saveTodos(){

            localStorage.setItem(
                "todos",
                JSON.stringify(todos)
            );

        }

    </script>

</body>
</html>
